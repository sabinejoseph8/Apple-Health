name: Checks

on:
  push:
  workflow_dispatch:

jobs:
  app:
    name: App (type check, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:functions
      # The build ends with scripts/check-build-secrets.mjs, which fails if
      # anything secret reached the files sent to browsers.
      - run: npm run build
      - name: The secret check catches a planted secret
        run: |
          echo 'const k="sb_secret_PLANTEDFAKEVALUE123"' > dist/planted.js
          if node scripts/check-build-secrets.mjs; then echo "The secret check missed a planted secret."; exit 1; fi
          rm dist/planted.js

  e2e:
    name: End to end (iPhone size, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  database:
    name: Database (row-level security and cross-user tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db
