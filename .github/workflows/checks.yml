name: Checks

on:
  push:
  workflow_dispatch:

jobs:
  app:
    name: App (type check, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The pandas reference check needs a Python that allows installs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:functions
      - name: The iPhone Shortcut is well formed
        run: python3 scripts/shortcut/test_build_shortcut.py
      - name: The pandas reference follows the agreed rules
        run: |
          python3 -m pip install --quiet -r scripts/reference/requirements.txt
          python3 -m unittest discover -s scripts/reference
      # The build ends with scripts/check-build-secrets.mjs, which fails if
      # anything secret reached the files sent to browsers.
      - run: npm run build
      - name: The secret check catches a planted secret
        run: |
          echo 'const k="sb_secret_PLANTEDFAKEVALUE123"' > dist/planted.js
          if node scripts/check-build-secrets.mjs; then echo "The secret check missed a planted secret."; exit 1; fi
          rm dist/planted.js

  # On a Mac, so WebKit draws text in Apple's system font, as the iPhone does:
  # the one-screen check (R23) depends on it. Linux's stand-in font is taller.
  e2e:
    name: End to end (iPhone size, WebKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  database:
    name: Database (row-level security and cross-user tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db

  local-e2e:
    name: Local end to end (tokens, sync, import and account settings against local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The pandas reference check needs a Python that allows installs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx supabase start
      - name: Start the server functions
        run: |
          nohup npx supabase functions serve < /dev/null > functions.log 2>&1 &
          for i in $(seq 1 90); do grep -q "Serving functions" functions.log && exit 0; sleep 2; done
          cat functions.log
          exit 1
      - run: npm run check:local:sync
      - run: npm run check:local:import
      - run: npm run check:local:account
      - name: The database matches the pandas reference on a made-up history
        run: |
          python3 -m pip install --quiet -r scripts/reference/requirements.txt
          python3 scripts/reference/check.py --local-synthetic
      - name: The privacy rules hold from the outside, as real people (made-up accounts)
        run: |
          python3 scripts/reference/privacy_check.py --local
          if python3 scripts/reference/privacy_check.py --local --prove > prove.log; then cat prove.log; echo "The privacy check missed an unprotected table."; exit 1; fi
          grep -q "privacy_check_leak: no one else's rows" prove.log
      - name: Function log
        if: failure()
        run: cat functions.log
