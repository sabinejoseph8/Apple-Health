<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 677" width="1200" height="677" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture of Clarivi: readings flow from the Apple Watch through an iPhone Shortcut and an ingest function into a secured database, a fixed score sets the status, an AI explains it behind a safety filter, and a notification and card deliver it, with reference checks, tests and an AI test set around it.">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
</defs>
<rect width="1200" height="677" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#1F2937">How Clarivi turns your Apple Watch night into a morning answer</text>
<rect x="760" y="62" width="14" height="14" rx="3" fill="#E8F1FF" stroke="#0A60D8" stroke-width="2"/>
<text x="780" y="74" font-size="14" fill="#4B5563">You and your phone</text>
<rect x="928" y="62" width="14" height="14" rx="3" fill="#F3E8FF" stroke="#7A3FD1" stroke-width="2"/>
<text x="948" y="74" font-size="14" fill="#4B5563">AI</text>
<rect x="984" y="62" width="14" height="14" rx="3" fill="#E6F4EA" stroke="#1E7B3A" stroke-width="2"/>
<text x="1004" y="74" font-size="14" fill="#4B5563">Stored data</text>
<rect x="1103" y="62" width="14" height="14" rx="3" fill="#FFF4E0" stroke="#B26A00" stroke-width="2"/>
<text x="1123" y="74" font-size="14" fill="#4B5563">Checks</text>
<rect x="40" y="90" width="240" height="140" rx="12" fill="#E8F1FF" stroke="#0A60D8" stroke-width="2"/>
<text x="54" y="118" font-size="17" font-weight="700" fill="#1F2937">Your Apple Watch</text>
<text x="54" y="144" font-size="14" fill="#4B5563">Records your night and sends</text>
<text x="54" y="163" font-size="14" fill="#4B5563">it to Apple Health on your</text>
<text x="54" y="182" font-size="14" fill="#4B5563">iPhone.</text>
<rect x="320" y="90" width="240" height="140" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="334" y="118" font-size="17" font-weight="700" fill="#1F2937">iPhone Shortcut</text>
<text x="334" y="144" font-size="14" fill="#4B5563">Reads last night from Health</text>
<text x="334" y="163" font-size="14" fill="#4B5563">and posts it. Runs when you</text>
<text x="334" y="182" font-size="14" fill="#4B5563">stop your alarm, unplug, or</text>
<text x="334" y="201" font-size="14" fill="#4B5563">open the app.</text>
<rect x="600" y="90" width="240" height="140" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="614" y="118" font-size="17" font-weight="700" fill="#1F2937">Ingest function</text>
<text x="614" y="144" font-size="14" fill="#4B5563">Checks your upload token,</text>
<text x="614" y="163" font-size="14" fill="#4B5563">stores the readings, never</text>
<text x="614" y="182" font-size="14" fill="#4B5563">edits them, skips repeats.</text>
<rect x="880" y="90" width="280" height="140" rx="12" fill="#E6F4EA" stroke="#1E7B3A" stroke-width="2"/>
<text x="894" y="118" font-size="17" font-weight="700" fill="#1F2937">Database (Supabase)</text>
<text x="894" y="144" font-size="14" fill="#4B5563">Raw readings, results and your</text>
<text x="894" y="163" font-size="14" fill="#4B5563">answers. Row-level security:</text>
<text x="894" y="182" font-size="14" fill="#4B5563">you see only your own rows.</text>
<line x1="280" y1="160" x2="318" y2="160" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="160" x2="598" y2="160" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="840" y1="160" x2="878" y2="160" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1020" y1="230" x2="1020" y2="303" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="880" y="305" width="280" height="140" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
<text x="894" y="333" font-size="17" font-weight="700" fill="#1F2937">Score (fixed arithmetic)</text>
<text x="894" y="359" font-size="14" fill="#4B5563">Your three readings against</text>
<text x="894" y="378" font-size="14" fill="#4B5563">your own usual range, plus a</text>
<text x="894" y="397" font-size="14" fill="#4B5563">sleep floor. Same readings,</text>
<text x="894" y="416" font-size="14" fill="#4B5563">same status, every time.</text>
<rect x="600" y="305" width="240" height="140" rx="12" fill="#F3E8FF" stroke="#7A3FD1" stroke-width="2"/>
<text x="614" y="333" font-size="17" font-weight="700" fill="#1F2937">AI explanation</text>
<text x="614" y="359" font-size="14" fill="#4B5563">Claude Opus 5.5 sees only</text>
<text x="614" y="378" font-size="14" fill="#4B5563">numbers and fixed words, no</text>
<text x="614" y="397" font-size="14" fill="#4B5563">name, email or calendar</text>
<text x="614" y="416" font-size="14" fill="#4B5563">dates. It explains the</text>
<text x="614" y="435" font-size="14" fill="#4B5563">status and never sets it.</text>
<rect x="320" y="305" width="240" height="140" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="2"/>
<text x="334" y="333" font-size="17" font-weight="700" fill="#1F2937">Safety filter</text>
<text x="334" y="359" font-size="14" fill="#4B5563">Ordinary code: no condition</text>
<text x="334" y="378" font-size="14" fill="#4B5563">names, advice or new numbers.</text>
<text x="334" y="397" font-size="14" fill="#4B5563">Digests also get a second</text>
<text x="334" y="416" font-size="14" fill="#4B5563">model check. If a text fails,</text>
<text x="334" y="435" font-size="14" fill="#4B5563">fixed wording shows instead.</text>
<rect x="40" y="305" width="240" height="140" rx="12" fill="#E8F1FF" stroke="#0A60D8" stroke-width="2"/>
<text x="54" y="333" font-size="17" font-weight="700" fill="#1F2937">Notification and card</text>
<text x="54" y="359" font-size="14" fill="#4B5563">A push, then the morning</text>
<text x="54" y="378" font-size="14" fill="#4B5563">card: your status, why, and</text>
<text x="54" y="397" font-size="14" fill="#4B5563">one action for today. Your</text>
<text x="54" y="416" font-size="14" fill="#4B5563">check-in goes back in.</text>
<line x1="878" y1="375" x2="842" y2="375" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="598" y1="375" x2="562" y2="375" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="318" y1="375" x2="282" y2="375" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1020,445 1020,479 160,479 160,447" fill="none" stroke="#1F2937" stroke-width="2" stroke-dasharray="2 0" marker-end="url(#arrow)"/>
<text x="590" y="471" font-size="14" text-anchor="middle" fill="#1F2937">The status comes straight from the score. The AI only adds the explanation.</text>
<rect x="40" y="503" width="1120" height="150" rx="12" fill="#FFF4E0" stroke="#B26A00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="533" font-size="17" font-weight="700" fill="#1F2937">How quality is checked</text>
<text x="60" y="563" font-size="14" font-weight="700" fill="#B26A00">Reference check</text>
<text x="60" y="585" font-size="14" fill="#4B5563">A pandas notebook recalculates</text>
<text x="60" y="604" font-size="14" fill="#4B5563">your whole year on its own, and the</text>
<text x="60" y="623" font-size="14" fill="#4B5563">database must agree, value for value.</text>
<text x="430" y="563" font-size="14" font-weight="700" fill="#B26A00">Tests</text>
<text x="430" y="585" font-size="14" fill="#4B5563">Database tests prove nobody can read</text>
<text x="430" y="604" font-size="14" fill="#4B5563">another person's rows, and an outside-in</text>
<text x="430" y="623" font-size="14" fill="#4B5563">privacy check and screen tests run too.</text>
<text x="800" y="563" font-size="14" font-weight="700" fill="#B26A00">AI test set</text>
<text x="800" y="585" font-size="14" fill="#4B5563">Invented cases written before any code,</text>
<text x="800" y="604" font-size="14" fill="#4B5563">plus a sealed set. Every miss is</text>
<text x="800" y="623" font-size="14" fill="#4B5563">reported next to its target.</text>
</svg>
